<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chek</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start;
            align-items: left;
            background-color: #f8f8f8;
        }

        .receipt-container {
            justify-content: flex-start;
            align-items: left;
        }

        .receipt {
            width: 65mm;
            padding: 0px;
            background-color: white;
        }

        .receipt-logo {
            text-align: center;
            padding: 4px 2mm 2px 2mm;
        }

        .receipt-logo img,
        .receipt-logo svg {
            width: 58mm;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .line {
            border-bottom: 1px dashed black;
            margin: 8px 10px;
        }

        .transaction-details {
            font-size: 10px;
            text-align: left;
            margin-bottom: 10px;
        }

        .transaction-details div {
            display: flex;
            justify-content: space-between;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            border-bottom: 1px dashed black;
            margin-bottom: 5px;
            padding-bottom: 5px;
            font-size: 12px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
        }

        .item-name {
            text-align: left;
            flex-grow: 1;
        }

        .item-quantity,
        .item-price {
            width: 60px;
            text-align: right;
        }

        .item-image img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .item-number {
            margin-right: 5px;
            font-weight: normal;
        }

        .total-section {
            font-weight: bold;
            font-size: 12px !important;
            margin-top: 10px;
        }

        .footer {
            margin-top: 20px;
            font-size: 10px;
            text-align: center;
            font-weight: normal;
        }
    </style>
</head>
<body onfocus="window.close()">
    <div class="receipt-container">
        <div class="receipt" id="receipt"></div>
    </div>

    <script>
        // ---- Read the query string (replaces PHP's $_GET) ----
        var params = new URLSearchParams(window.location.search);

        // Get a parameter and split by comma (replaces explode(",", $_GET[...]))
        function getList(name) {
            var v = params.get(name);
            return v === null ? [] : v.split(',');
        }

        // Get a single raw parameter value
        function getVal(name) {
            return params.get(name) || '';
        }

        // PHP intval(): take the leading integer, 0 if not a number
        function intval(v) {
            var n = parseInt(v, 10);
            return isNaN(n) ? 0 : n;
        }

        // PHP number_format($n, 0, '', ','): round, no decimals, comma thousands separator
        function numberFormat(v) {
            var n = Math.round(parseFloat(v) || 0);
            return n.toLocaleString('en-US', { maximumFractionDigits: 0 });
        }

        // Escape user data so item names with special characters don't break the markup
        function esc(s) {
            return String(s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // ---- Build the item list (replaces the foreach + usort) ----
        var tovar    = getList('tovar');
        var miqdori  = getList('miqdori');
        var jami     = getList('jami');
        var narxi    = getList('narxi');
        var datetime = getList('datetime');

        var result = tovar.map(function (key, i) {
            return {
                tovar: key,
                miqdori: miqdori[i],
                jami: jami[i],
                narxi: narxi[i],
                datetime: datetime[i]
            };
        });

        // Sort by datetime (replaces usort + strtotime)
        result.sort(function (a, b) {
            var ta = Date.parse(a.datetime) || 0;
            var tb = Date.parse(b.datetime) || 0;
            return ta - tb;
        });

        // Clean logo markup (uses "uychi tunkafon.jpg" if available, otherwise crisp SVG)
                var logoHtml = '<div class="receipt-logo">'
            + '<img src="uychi tunkafon.jpg" alt="Uychi Tunkafon Markazi" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'block\';" />'
            + '<svg style="display:none;" viewBox="0 0 980 350" xmlns="http://www.w3.org/2000/svg">'
            +   '<polygon points="20,170 175,20 250,92 250,48 282,48 282,123 330,170 288,170 175,60 62,170" fill="#F97300"/>'
            +   '<path d="M 255 169 A 92 92 0 1 0 175 307 L 635 307" fill="none" stroke="#031B59" stroke-width="28" stroke-linecap="butt"/>'
            +   '<rect x="136" y="184" width="28" height="28" fill="#031B59"/>'
            +   '<rect x="171" y="184" width="28" height="28" fill="#031B59"/>'
            +   '<rect x="136" y="219" width="28" height="28" fill="#031B59"/>'
            +   '<rect x="171" y="219" width="28" height="28" fill="#031B59"/>'
            +   '<text x="228" y="244" textLength="710" lengthAdjust="spacingAndGlyphs" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="70" fill="#031B59">UYCHI TUNKAFON</text>'
            +   '<text x="663" y="318" textLength="275" lengthAdjust="spacingAndGlyphs" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="44" fill="#031B59">MARKAZI</text>'
            + '</svg>'
            + '</div>';

        // ---- Render the receipt ----
        var html = '';
        html += logoHtml;
        html += '<div class="line"></div>';
        html += '<div class="transaction-details">'
              +   '<div><span>Tranzaksiya IDsi:</span><span>' + esc(getVal('cart')) + '</span></div>'
              +   '<div><span>Sana:</span><span>' + esc(getVal('sana')) + '</span></div>'
              +   '<div><span>Mijoz:</span><span>' + esc(getVal('mijoz')) + '</span></div>'
              +   '<div><span>Telefon raqam:</span><span>' + esc(getVal('telefon')) + '</span></div>'
              + '</div>';
        html += '<div class="line"></div>';
        html += '<div class="item-header"><span>Tovarlar</span><span>Yig\'indisi</span></div>';

        var counter = 1;
        result.forEach(function (row) {
            html += '<div class="item">'
                  +   '<div class="item-number">' + counter + ')</div>'
                  +   '<div class="item-name"> ' + esc(row.tovar) + ' </div>'
                  +   '<div class="item-quantity">' + esc(row.miqdori) + ' x ' + numberFormat(row.narxi) + '</div>'
                  +   '<div class="item-price">' + numberFormat(row.jami) + '</div>'
                  + '</div>';
            counter++;
        });

        html += '<div class="line"></div>';

        // Optional square-meter / profnastil rows
        var extra = '';
        if (intval(getVal('kvadrat')) > 0)     extra += '<div class="item"><span>Jami kvadrat:</span><span>' + esc(getVal('kvadrat')) + ' </span></div>';
        if (intval(getVal('nerjavinka')) > 0)  extra += '<div class="item"><span>Nerjavinka kvadrat:</span><span>' + esc(getVal('nerjavinka')) + ' </span></div>';
        if (intval(getVal('jamiprof')) > 0)    extra += '<div class="item"><span>Jami profnastil m:</span><span>' + esc(getVal('jamiprof')) + ' </span></div>';
        if (intval(getVal('profkvadrat')) > 0) extra += '<div class="item"><span>Profnastil kvadrati:</span><span>' + esc(getVal('profkvadrat')) + ' </span></div>';
        html += '<div>' + extra + '</div>';

        html += '<div class="line"></div>';

        // Totals
        var totals = '';
        totals += '<div class="item"><span>Jami:</span><span>' + numberFormat(getVal('hammasi')) + ' </span></div>';
        totals += '<div class="item"><span>To\'landi:</span><span>' + numberFormat(getVal('paid')) + ' </span></div>';
        if (intval(getVal('dollar')) > 0) totals += '<div class="item"><span>To\'landi (dollar):</span><span>' + numberFormat(getVal('dollar')) + ' </span></div>';
        if (intval(getVal('qarz')) > 0)   totals += '<div class="item"><span>Qarz:</span><span>' + numberFormat(getVal('qarz')) + ' </span></div>';
        if (intval(getVal('qaytim')) > 0) totals += '<div class="item"><span>Qaytim:</span><span>' + numberFormat(getVal('qaytim')) + ' </span></div>';
        html += '<div class="total-section">' + totals + '</div>';

        html += '<div class="line"></div>';
        html += '<div class="footer">'
              +   'Bizni tanlaganingiz uchun rahmat!<br><br>'
              +   'Ulug\'bek +998 95 116 77 88 <br>'
              +   '<span style="display: inline-block; padding-left: 45px;">+998 99 264 44 44</span>'
              + '</div>';

        document.getElementById('receipt').innerHTML = html;

        // Auto-print once everything is laid out
        window.addEventListener('load', function () {
            window.print();
        });
    </script>
</body>
</html>
